# 模型配置文件

model:
  detector_type: "ensemble"
  random_forest:
    n_estimators: 100
    max_depth: 10
    min_samples_split: 5
    n_jobs: -1
  svm:
    kernel: "rbf"
    C: 1.0
    gamma: "scale"
  ensemble:
    models:
      - "random_forest"
      - "gradient_boosting"
      - "svm"
    voting: "soft"
  test_size: 0.2
  random_state: 42
